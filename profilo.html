<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il tuo profilo — The Last Call</title>
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0c0e;
    --panel:#111517;
    --ink:#e9edee;
    --ink-dim:#8b9699;
    --signal:#6fd8d1;
    --line:rgba(199,206,208,0.16);
    --silver:#c7ced0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--void);color:var(--ink);
    font-family:'Newsreader', serif;font-size:18px;line-height:1.6;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:48px 20px;
  }
  .card{
    width:100%;max-width:600px;
    background:
      radial-gradient(ellipse 500px 340px at 85% 8%, rgba(111,216,209,0.12), transparent 60%),
      linear-gradient(180deg, #0d1113 0%, #0a0c0e 100%);
    border:1px solid rgba(199,206,208,0.35);border-radius:12px;
    padding:clamp(32px, 6vw, 52px) clamp(24px, 5vw, 48px);
    text-align:center;
  }
  .back{display:inline-block;font-family:'Space Grotesk', sans-serif;font-size:.82rem;letter-spacing:.08em;color:var(--ink-dim);text-decoration:none;margin-bottom:20px;}
  .back:hover{color:var(--signal);}
  h1{font-family:'Space Grotesk', sans-serif;font-size:clamp(1.6rem,4vw,2.2rem);margin:0 0 6px 0;color:var(--silver);
    background:linear-gradient(115deg,#f4f6f6 10%, #9aa5a8 45%, #f4f6f6 60%, #838f92 90%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  p.sub{color:var(--ink-dim);font-size:.98rem;margin:0 0 24px 0;}
  .avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:24px;}
  .avatar{width:128px;height:128px;border-radius:50%;object-fit:cover;border:2px solid rgba(199,206,208,0.4);background:var(--panel);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk', sans-serif;font-size:2.4rem;color:var(--signal);overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  label.file{font-family:'Space Grotesk', sans-serif;font-size:.88rem;letter-spacing:.04em;border:1px solid rgba(199,206,208,0.4);border-radius:8px;padding:11px 22px;cursor:pointer;color:var(--ink);}
  label.file:hover{border-color:var(--signal);color:var(--signal);}
  input[type="file"]{display:none;}
  button{font-family:'Space Grotesk', sans-serif;font-size:.92rem;letter-spacing:.03em;border-radius:2px;padding:12px 22px;cursor:pointer;border:none;background:var(--silver);color:var(--void);}
  button:hover{background:var(--signal);}
  button:disabled{opacity:.6;cursor:wait;}
  button.ghost{background:transparent;color:var(--ink);border:1px solid rgba(199,206,208,0.4);}
  button.ghost:hover{border-color:#e8a0a0;color:#e8a0a0;}
  button.ghost, label.file, input, textarea, a{outline:none;}
  button:focus-visible, label.file:focus-visible, input:focus, textarea:focus, a:focus-visible{outline:2px solid var(--signal);outline-offset:3px;}
  .field{text-align:left;margin-bottom:16px;}
  .field label{display:block;font-family:'Space Grotesk', sans-serif;font-size:.82rem;letter-spacing:.08em;color:var(--ink-dim);margin-bottom:8px;}
  .field input, .field textarea{width:100%;background:transparent;border:1px solid var(--line);color:var(--ink);padding:13px 16px;font-family:'Newsreader', serif;font-size:1rem;border-radius:2px;resize:vertical;}
  .field .hint{font-size:.82rem;color:var(--ink-dim);margin-top:6px;}
  .msg{display:none;font-family:'Space Grotesk', sans-serif;font-size:.9rem;margin:14px 0 0 0;}
  .msg.ok{display:block;color:var(--signal);}
  .msg.err{display:block;color:#e8a0a0;}
  .links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px;}
  .links a{font-family:'Space Grotesk', sans-serif;font-size:.88rem;color:var(--ink-dim);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px;}
  .links a:hover{color:var(--signal);border-color:var(--signal);}
</style>
</head>
<body>
  <main class="card">
    <a class="back" href="area.html">← LA TUA AREA</a>
    <h1>IL TUO PROFILO</h1>
    <p class="sub" id="email-line">Caricamento…</p>

    <div class="avatar-wrap">
      <div class="avatar" id="avatar">?</div>
      <div class="photo-btns">
        <label class="file" for="photo">Scegli foto</label>
        <input type="file" id="photo" accept="image/jpeg,image/png,image/webp">
        <button id="btn-photo" disabled>Carica foto</button>
        <button class="ghost hidden" id="btn-remove">Rimuovi</button>
      </div>
    </div>

    <div class="field">
      <label for="handle">NOME UTENTE</label>
      <input type="text" id="handle" maxlength="20" autocomplete="off" spellcheck="false">
      <div class="hint">3–20 caratteri: minuscole, numeri e _</div>
    </div>

    <div class="field">
      <label for="bio">BIO</label>
      <textarea id="bio" rows="3" maxlength="280" placeholder="Chi sei, cosa cerchi qui dentro…"></textarea>
      <div class="hint"><span id="count">0</span>/280</div>
    </div>

    <button id="btn-save">Salva profilo</button>
    <p class="msg" id="msg"></p>

    <div class="links">
      <a href="area.html">Area</a>
      <a href="index.html">Home</a>
      <a href="manifesto.html">Manifesto</a>
    </div>
  </main>

<script>
const avatarEl = document.getElementById('avatar');
const photoInput = document.getElementById('photo');
const btnPhoto = document.getElementById('btn-photo');
const btnRemove = document.getElementById('btn-remove');
const handleEl = document.getElementById('handle');
const bioEl = document.getElementById('bio');
const countEl = document.getElementById('count');
const msg = document.getElementById('msg');
let pendingDataUrl = '';

function show(text, kind) {
  msg.textContent = text;
  msg.className = 'msg ' + kind;
}

function renderAvatar(url, fallback) {
  avatarEl.innerHTML = '';
  if (url) {
    const img = document.createElement('img');
    img.src = url;
    img.alt = 'Foto profilo';
    avatarEl.appendChild(img);
    btnRemove.classList.remove('hidden');
  } else {
    avatarEl.textContent = (fallback || '?').charAt(0).toUpperCase();
    btnRemove.classList.add('hidden');
  }
}

bioEl.addEventListener('input', () => { countEl.textContent = bioEl.value.length; });

async function load() {
  const res = await fetch('/api/profile');
  if (res.status === 401) { window.location.href = '/accesso.html'; return; }
  const data = await res.json();
  document.getElementById('email-line').textContent = data.user.email;
  handleEl.value = data.user.handle || '';
  bioEl.value = data.user.bio || '';
  countEl.textContent = bioEl.value.length;
  renderAvatar(data.user.avatar_url, data.user.handle);
}

// Riduci la foto nel browser: max 512px, JPEG 0.82 — leggera e veloce.
photoInput.addEventListener('change', () => {
  const file = photoInput.files[0];
  if (!file) return;
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) {
    show('Formato non supportato: usa JPG, PNG o WebP.', 'err');
    return;
  }
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    const max = 512;
    const scale = Math.min(1, max / Math.max(img.width, img.height));
    const w = Math.round(img.width * scale);
    const h = Math.round(img.height * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    pendingDataUrl = canvas.toDataURL('image/jpeg', 0.82);
    renderAvatar(pendingDataUrl, handleEl.value);
    btnPhoto.disabled = false;
    show('Anteprima pronta. Premi «Carica foto».', 'ok');
  };
  img.onerror = () => { URL.revokeObjectURL(url); show('Impossibile leggere questa immagine.', 'err'); };
  img.src = url;
});

btnPhoto.addEventListener('click', async () => {
  if (!pendingDataUrl) return;
  btnPhoto.disabled = true;
  btnPhoto.textContent = 'Caricamento…';
  try {
    const res = await fetch('/api/avatar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ avatarDataUrl: pendingDataUrl }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Errore');
    pendingDataUrl = '';
    btnPhoto.disabled = true;
    btnPhoto.textContent = 'Carica foto';
    show('Foto aggiornata.', 'ok');
  } catch (err) {
    show(err.message || 'Caricamento fallito.', 'err');
    btnPhoto.disabled = false;
    btnPhoto.textContent = 'Carica foto';
  }
});

btnRemove.addEventListener('click', async () => {
  try {
    const res = await fetch('/api/avatar', { method: 'DELETE' });
    if (!res.ok) throw new Error('Errore');
    renderAvatar('', handleEl.value);
    show('Foto rimossa.', 'ok');
  } catch {
    show('Rimozione fallita.', 'err');
  }
});

document.getElementById('btn-save').addEventListener('click', async (e) => {
  const btn = e.currentTarget;
  btn.disabled = true;
  btn.textContent = 'Salvataggio…';
  try {
    const res = await fetch('/api/profile', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ handle: handleEl.value.trim().toLowerCase(), bio: bioEl.value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Errore');
    handleEl.value = data.user.handle;
    renderAvatar(avatarEl.querySelector('img')?.src || '', data.user.handle);
    show('Profilo salvato.', 'ok');
  } catch (err) {
    show(err.message || 'Salvataggio fallito.', 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Salva profilo';
  }
});

load();
</script>
</body>
</html>
