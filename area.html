<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La tua area — The Last Call</title>
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0c0e;
    --panel:#111517;
    --ink:#e9edee;
    --ink-dim:#8b9699;
    --signal:#6fd8d1;
    --line:rgba(199,206,208,0.16);
    --silver:#c7ced0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--void);
    color:var(--ink);
    font-family:'Newsreader', serif;
    font-size:18px;
    line-height:1.6;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
  }
  .card{
    width:100%;
    max-width:560px;
    background:linear-gradient(180deg, #0d1113 0%, #0a0c0e 100%);
    border:1px solid rgba(199,206,208,0.35);
    border-radius:12px;
    padding:clamp(36px, 6vw, 56px) clamp(24px, 5vw, 48px);
    text-align:center;
  }
  h1{font-family:'Space Grotesk', sans-serif;font-size:clamp(1.6rem,4vw,2.2rem);margin:0 0 8px 0;color:var(--silver);}
  p{color:var(--ink-dim);}
  p strong{color:var(--ink);}
  .pill{display:inline-block;font-family:'Space Grotesk', sans-serif;font-size:.82rem;letter-spacing:.08em;border:1px solid var(--line);border-radius:999px;padding:6px 16px;margin:14px 0 0 0;color:var(--signal);}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px;}
  a,button{font-family:'Space Grotesk', sans-serif;font-size:.92rem;letter-spacing:.04em;text-decoration:none;border-radius:2px;padding:13px 24px;cursor:pointer;}
  a.primary{background:var(--silver);color:var(--void);}
  a.primary:hover{background:var(--signal);}
  a.ghost,button.ghost{background:transparent;color:var(--ink);border:1px solid rgba(199,206,208,0.4);}
  a.ghost:hover,button.ghost:hover{border-color:var(--signal);color:var(--signal);}
  button.ghost{border:1px solid rgba(199,206,208,0.4);}
</style>
</head>
<body>
  <main class="card">
    <h1 id="title">La tua area</h1>
    <p id="sub">Verifica della sessione in corso…</p>
    <div><span class="pill hidden" id="sub-pill"></span></div>
    <div class="row">
      <a class="primary" id="btn-profile" href="profilo.html">Il tuo profilo</a>
      <a class="primary hidden" id="btn-feed" href="manifesto.html">Rileggi il manifesto</a>
      <a class="ghost" href="index.html">Home</a>
      <button class="ghost hidden" id="btn-out">Esci</button>
    </div>
  </main>

<script>
async function load() {
  const title = document.getElementById('title');
  const sub = document.getElementById('sub');
  const pill = document.getElementById('sub-pill');
  try {
    const res = await fetch('/api/me');
    const data = await res.json();
    if (!res.ok) throw new Error();
    title.textContent = 'Ciao, ' + data.user.handle;
    sub.innerHTML = 'Accesso come <strong>' + data.user.email + '</strong>.<br>Feed, chat e gruppi arrivano qui dentro a breve.';
    document.getElementById('btn-feed').classList.remove('hidden');
    document.getElementById('btn-out').classList.remove('hidden');
    if (data.subscription) {
      pill.textContent = 'Abbonamento: ' + data.subscription.status;
      pill.classList.remove('hidden');
    } else {
      pill.textContent = 'Abbonamento: da attivare (pagamento Revolut in arrivo)';
      pill.classList.remove('hidden');
    }
  } catch {
    title.textContent = 'Non sei dentro';
    sub.innerHTML = 'La sessione manca o è scaduta.';
    const a = document.createElement('a');
    a.href = '/accesso.html';
    a.className = 'primary';
    a.textContent = 'Vai all\u2019accesso';
    document.querySelector('.row').prepend(a);
  }
}

document.getElementById('btn-out').addEventListener('click', async () => {
  await fetch('/api/auth-logout', { method: 'POST' });
  window.location.href = '/accesso.html';
});

load();
</script>
</body>
</html>
